; PlatformIO Project Configuration File

[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200


[env:native_button]
platform = native
test_framework = unity

test_filter = test_button
test_build_src = yes

build_src_filter =
    -<*>
    +<button.cpp>

build_flags =
    -Isrc