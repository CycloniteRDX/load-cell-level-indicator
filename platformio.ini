; PlatformIO Project Configuration File

[platformio]
default_envs = nanoatmega328new


[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
monitor_speed = 115200

build_src_filter =
    +<*>
    -<main_arduino.cpp>
    -<watchdog_validation.c>
    -<hal_gpio_arduino.cpp>
    -<hal_time_arduino.cpp>
    -<hal_storage_arduino.cpp>
    -<hal_serial_arduino.cpp>


[env:nanoatmega328new_arduino]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200

build_src_filter =
    +<*>
    -<main_avr.cpp>
    -<watchdog_validation.c>
    -<hal_gpio_arduino.cpp>
    -<hal_time_arduino.cpp>
    -<hal_storage_arduino.cpp>
    -<hal_serial_arduino.cpp>


[env:nanoatmega328new_watchdog_validation]
extends = env:nanoatmega328new

build_src_filter =
    ${env:nanoatmega328new.build_src_filter}
    +<watchdog_validation.c>

build_flags =
    -DWATCHDOG_HARDWARE_VALIDATION=1


[env:nanoatmega328new_arduino_watchdog_validation]
extends = env:nanoatmega328new_arduino

build_src_filter =
    ${env:nanoatmega328new_arduino.build_src_filter}
    +<watchdog_validation.c>

build_flags =
    -DWATCHDOG_HARDWARE_VALIDATION=1


[env:native_button]
platform = native
test_framework = unity

test_filter = test_button
test_build_src = yes

build_src_filter =
    -<*>
    +<button.cpp>

build_flags =
    -Isrc

